services:
  backend:
    build: ./server
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    depends_on:
      - backend
    tty: true
    stdin_open: true
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
